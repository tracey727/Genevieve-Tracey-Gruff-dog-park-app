name: Gruff Required CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run application tests
        run: npm test
      - name: Build Vite application
        run: npm run build
      - name: Verify Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
