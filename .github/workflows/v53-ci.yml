name: GENEVIEVE V53 CI

on:
  push:
    branches:
      - main
      - "cleanup/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Cloudflare Worker dry-run
        run: npx wrangler deploy --dry-run
