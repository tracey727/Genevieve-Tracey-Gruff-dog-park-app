name: Materialize GENEVIEVE V53

on:
  push:
    branches:
      - agent/master-blueprint-live-v53
    paths:
      - .github/workflows/materialize-v53.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify and restore tested source bundle
        shell: bash
        run: |
          cat .deploy/v53.aa .deploy/v53.ab .deploy/v53.ac .deploy/v53.ad .deploy/v53.ae .deploy/v53.af > /tmp/genevieve-code.b64
          base64 -d /tmp/genevieve-code.b64 > /tmp/genevieve-code.tar.gz
          echo "2b7a083c2019b79ca277fcc484269e37262fdd6b7d5303883025dea320e87e98  /tmp/genevieve-code.tar.gz" | sha256sum -c -
          tar -xzf /tmp/genevieve-code.tar.gz -C .
          rm -rf .deploy
          rm -f .github/workflows/materialize-v53.yml
          git config user.name "GENEVIEVE deploy bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build GENEVIEVE V53 from master blueprint"
          git push origin HEAD:${GITHUB_REF_NAME}
